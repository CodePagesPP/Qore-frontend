<div class="cards-container">
  <div class="role-card" *ngFor="let role of personal | keyvalue" [ngClass]="role.key.toLowerCase()">
    <div class="role-header">
      <h2>{{ role.key }}</h2>
      <p>Usuarios con rol {{ role.key }}</p>
    </div>

    <div class="user-card" *ngFor="let user of role.value">
      <div class="user-info">
        <h3>{{ user.name }} {{ user.lastName }}</h3>
        <p>ID: {{ user.id }}</p>
        <p>Email: {{ user.email }}</p>
        <p>Teléfono: {{ user.phoneNumber }}</p>
        <p>DNI: {{ user.dni }}</p>
      </div>

      <div class="user-role">
        <span>{{ user.role }}</span>
        <div class="actions">
          <button class="btn edit">
            <i class="fas fa-edit"></i>
          </button>
          <button class="btn delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
