<div class="body">
  <div class="container" [class.active]="isActive">
  <div class="form-box login">
    <form (ngSubmit)="onSubmit()">
      <h1>Inicia Sesión</h1>
      <div class="input-box">
        <input
          type="email"
          placeholder="example@gmail.com"
          id="email"
          [(ngModel)]="credentials.email"
          name="email"
          required
        />
        <i class="fa fa-envelope" aria-hidden="true"></i>
      </div>

      <div class="input-box">
        <input
          type="password"
          id="password"
          [(ngModel)]="credentials.password"
          placeholder="contraseña"
          name="password"
          required
        />
        <i class="fa fa-lock" aria-hidden="true"></i>
      </div>

      <div class="forgot-link">
        <a href="#">Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn">Iniciar Sesión</button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
  
  <div class="form-box register">
      <form (ngSubmit)="onSubmit()">
        <h1>Regístrate</h1>
        <div class="input-box">
          <input
            type="email"
            placeholder="Nombre"
            id="email"
            [(ngModel)]="credentials.email"
            name="email"
            required
          />
          <i class="fa fa-user" aria-hidden="true"></i>
        </div>
        <div class="input-box">
          <input
            type="email"
            placeholder="example@gmail.com"
            id="email"
            [(ngModel)]="credentials.email"
            name="email"
            required
          />
          <i class="fa fa-envelope" aria-hidden="true"></i>
        </div>
        <div class="input-box">
          <input
            type="password"
            id="password"
            [(ngModel)]="credentials.password"
            placeholder="contraseña"
            name="password"
            required
          />
          <i class="fa fa-lock" aria-hidden="true"></i>
        </div>
        <button type="submit" class="btn">Regístrate</button>

        <p class="error" *ngIf="error">{{ error }}</p>
      </form>
  </div>

  <div class="toggle-box"></div>

  <div class="toggle-panel toggle-left">
    <h1>Hola, Bienvenido!</h1>
    <p>Aún no tienes cuenta?</p>
    <button class="btn register-btn" (click)="activateRegister()">Regístrate</button>
  </div>

  <div class="toggle-panel toggle-right">
    <h1>Bienvenido de vuelta!</h1>
    <p>Ya tienes cuenta?</p>
    <button class="btn login-btn" (click)="activateLogin()">Inicia Sesión</button>
  </div>
</div>
</div>
