<div class="reset-password-container">
  <div class="reset-password-card">
    <img src="assets/logoQore.png" alt="Logo" class="logo" />  <!-- ← Logo -->

    <h2>Restablecer Contraseña</h2>
    <p class="subtitle">Ingresa y confirma tu nueva contraseña para continuar</p>

    <form #resetForm="ngForm" (ngSubmit)="onSubmit()">
  <input
    type="password"
    placeholder="Nueva contraseña"
    [(ngModel)]="newPassword"
    name="newPassword"
    required
    #newPasswordInput="ngModel"
  />
  <input
    type="password"
    placeholder="Confirmar contraseña"
    [(ngModel)]="confirmPassword"
    name="confirmPassword"
    required
    #confirmPasswordInput="ngModel"
  />

  <button 
    type="submit" 
    class="btn-primary" 
    [disabled]="loading || resetForm.invalid">
    Cambiar contraseña
  </button>
</form>


    <p *ngIf="message" class="success">{{ message }}</p>
    <p *ngIf="error" class="error">{{ error }}</p>
  </div>
</div>

<!-- Overlay de carga -->
<div class="loading-overlay" *ngIf="loading">
  <div class="loading-spinner"></div>
  <p>Procesando...</p>
</div>
